<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231F3327' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='M12 6v6l4 2'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURA Dental Studio — Odontologia Estética & Reabilitação Oral</title>
    <meta name="description" content="Aura Studio: excelência clínica, arquitetura acolhedora e precisão estética em odontologia contemporânea." />
    <!-- Google Fonts: Cormorant Garamond (Editorial Serif), Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Tailwind CSS Play CDN com Paleta Editorial Cromática AURA (Verde Profundo, Terracota, Sage, Off-White Quente) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              aura: {
                // Base Quente
                bone: '#F7F4EE',
                surface: '#EFECE4',
                card: '#FFFFFF',
                border: '#E2DDD3',
                divider: '#EBE6DC',
                stone: '#7D7A73',
                charcoal: '#20201E',
                noir: '#131413',

                // Cores Principais com Personalidade
                forest: '#1B2E24',     // Verde Floresta Profundo Arquitetônico
                forestDark: '#122019', // Verde Escuro para seções noturnas
                sage: '#466352',       // Verde Sálvia Elegante
                sageLight: '#E8EFEA',  // Sálvia Suave para contraste
                
                // Secundária / Calor
                terracotta: '#C15C3D',      // Terracota / Coral Queimado
                terracottaLight: '#FBF0EB', // Fundo terracota aveludado
                terracottaDark: '#9E4429',
                
                // Accent / Iluminação da Aura
                amber: '#C99E5C',      // Dourado / Champagne refinado
                amberLight: '#F8F4EC',
                glow: 'rgba(201, 158, 92, 0.15)'
              }
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-aura-bone text-aura-charcoal antialiased selection:bg-aura-terracotta/20 selection:text-aura-forest font-sans min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
